name: Market Digest

on:
  schedule:
    # 08:10 IST = 02:40 UTC, Monday to Friday
    - cron: "40 2 * * 1-5"
    # second run at 09:05 IST (pre-open refresh; also covers a skipped 08:10)
    - cron: "35 3 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to build"
        type: choice
        default: full
        options: [full, movers, orders, results, policy, custom]
      query:
        description: "Specific ask (only for custom mode)"
        type: string
        default: ""
      threshold:
        description: "Movers threshold in % (e.g. 10)"
        type: string
        default: "10"

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
        run: |
          python scripts/build_digest.py \
            --mode "${{ github.event.inputs.mode || 'full' }}" \
            --query "${{ github.event.inputs.query || '' }}" \
            --threshold "${{ github.event.inputs.threshold || '10' }}"

      - name: Commit data
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          python scripts/rebuild_index.py
          git add data/
          git diff --cached --quiet && { echo "nothing new"; exit 0; } || git commit -m "digest: ${{ github.event.inputs.mode || 'full' }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git fetch origin ${{ github.ref_name }}
            if git rebase origin/${{ github.ref_name }}; then :; else
              git checkout --theirs data/index.json 2>/dev/null || true
              python scripts/rebuild_index.py
              git add data/
              GIT_EDITOR=true git rebase --continue || true
            fi
            python scripts/rebuild_index.py
            if ! git diff --quiet data/index.json; then git add data/index.json && git commit -m "digest: rebuild index" || true; fi
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
